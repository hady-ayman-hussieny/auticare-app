name: auticare
description: AutiCare - Autism screening and specialist care platform
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # Font – matches web app's "Inter" (Google Fonts)
  google_fonts: ^6.2.1

  # Navigation
  go_router: ^13.2.0

  # HTTP client (mirrors web app's axios)
  dio: ^5.4.3+1

  # Secure token storage (replaces localStorage for token/user)
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.2

  # Shared preferences (non-sensitive flags like latestChildId, role)
  shared_preferences: ^2.2.3

  # Real-time chat (SignalR – same as web app's ChatHub)
  signalr_netcore: ^1.3.5

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

  # URL launching (Zoom links in chat)
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
